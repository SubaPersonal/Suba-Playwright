what is optional parameter?
=============================
An optional parameter is a parameter that is not mandatory when calling a function. 
In TypeScript, we use the ? symbol to define it.

Easy rule 
--------
Required information → normal parameter
Not always required → optional parameter (?)

Syntax of optional parameter
---------------------------------
function functionName(parameterName?: dataType) {  //The ? means the parameter is optional.
    // code
}

Ex
--
// file name : optionalparameter.spec.ts
import test from "@playwright/test";

test('Optional Paramter', async({page})=>{
    function location(city?:string){
    console.log(city)
    }
   
    location()
    location("Bangalore")
    location("chennai")  // Why does "chennai" show an error? because declared only bangalore
    // function location(city?:string) -- we can use as string type - "chennai" will execute
    //function location(city?:"Bangalore")--Why does "chennai" show an error? because declared only bangalore
})
