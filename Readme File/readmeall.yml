What is a Locator in laywright Locator?
=========================================

Locator is used to identify and interact with web elements. 
It provides auto-waiting and retry-ability, making Playwright tests more reliable.”


Types of Playwright Locators 
============================

Playwright provides several built-in locator methods:
Locator	                Purpose	                          Example
getByRole() 	      Find by accessibility role	      page.getByRole('button', {name:'Login'}) 
getByText()	        Find by visible text	            page.getByText('Login')
getByLabel()	      Find form fields by label	        page.getByLabel('Username')
getByPlaceholder()	Find by placeholder	              page.getByPlaceholder('Enter username')
getByAltText()	    Find images by alt text	          page.getByAltText('Logo')
getByTitle()	      Find by title attribute	          page.getByTitle('Close')
getByTestId()	      Find by data-testid	              page.getByTestId('login-button')
locator()	          CSS/XPath or other selectors	    page.locator('#username')

  1. getByRole() 
  -------------------------------
  --> Uses accessibility roles.
  --> Best choice for buttons, links, checkboxes, and other accessible elements.
  --> We use getByRole() to locate an element based on its accessibility role, 
      such as button, link, textbox, checkbox, radio button, heading, etc.

1. Button         - await page.getByRole('button', { name: 'Login' }).click();
2. Link           - await page.getByRole('link', { name: 'Home' }).click();
3. Textbox        - await page.getByRole('textbox', { name: 'Username' }).fill('admin');
4. Checkbox       - await page.getByRole('checkbox', { name: 'Remember me' }).check();
5. Radio button   - await page.getByRole('radio', { name: 'Male' }).check();
6. Heading        - await expect(page.getByRole('heading', { name: 'Dashboard' })).toBeVisible();

